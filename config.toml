# JARVIS Voice Unified Configuration

[dictation]
default_engine = "turbo"
preferred_injector = "auto"
enable_polish = true
enable_backtracking = true
dev_mode = true
hotkey = "SUPER+SPACE"

[assistant]
hotkey = "SUPER+J"
voice = "en-US-ChristopherNeural"
