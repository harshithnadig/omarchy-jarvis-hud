[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-jarvis-hud"
version = "0.2.0"
description = "High-performance offline-first voice dictation system & keyboard for Linux/Wayland"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Harshith Nadig" }
]
dependencies = [
    "numpy",
    "sounddevice",
    "editdistance",
    "fastapi",
    "httpx",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]
gpu = [
    "torch>=2.0",
    "ctranslate2>=4.0",
    "faster-whisper>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
